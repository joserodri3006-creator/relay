services:
  postgres:
    image: postgres:17.5-bookworm
    environment:
      POSTGRES_DB: relay_test
      POSTGRES_USER: relay_owner
      POSTGRES_PASSWORD: local-test-owner-password
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay_owner -d relay_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
